{% if not entry %}
  <!-- Not scheduled for this day -->
  <td class="schedule-cell cell-pending" style="border-right: 1px solid var(--jspl-border);"></td>
{% else %}
  <!-- Scheduled for this day -->
  <td id="cell-eq{{ entry.equipment.id }}-day{{ day }}"
      class="schedule-cell 
             {% if entry.status == 'DONE' %}cell-done
             {% elif entry.status == 'NR' %}cell-nr
             {% elif entry.status == 'SD' %}cell-sd
             {% elif entry.status == 'NA' %}cell-na
             {% elif entry.status == 'NP' %}cell-np
             {% elif entry.status == 'PENDING' %}cell-pending
             {% endif %}"
      style="border-right: 1px solid var(--jspl-border);"
      x-data="scheduleCellState({{ entry.equipment.id }}, {{ day }}, '{{ entry.status }}')"
      @click="open = !open">
      
      <!-- Cell content display -->
      <span style="font-size: 0.75rem;">
        {% if entry.status == 'DONE' %}
          {{ day }}
        {% elif entry.status == 'PENDING' %}
          —
        {% else %}
          {{ entry.status }}
        {% endif %}
      </span>

      <!-- Dropdown update overlay -->
      <div x-show="open" 
           @click.outside="open = false" 
           style="position: absolute; top: 100%; left: 50%; transform: translateX(-50%); background: white; border: 1px solid var(--jspl-border); border-radius: 4px; box-shadow: var(--shadow-md); z-index: 100; min-width: 140px; padding: 4px;"
           @click.stop>
        
        <form hx-post="{% url 'cmc:update_cell' department.id %}" 
              hx-target="#cell-eq{{ entry.equipment.id }}-day{{ day }}" 
              hx-swap="outerHTML">
          <input type="hidden" name="entry_id" value="{{ entry.id }}">
          
          <select name="status" 
                  class="input-mono" 
                  style="width: 100%; height: 28px; font-size: 0.75rem; padding: 2px;" 
                  onchange="this.form.dispatchEvent(new Event('submit'))">
            <option value="PENDING" {% if entry.status == 'PENDING' %}selected{% endif %}>Pending</option>
            <option value="DONE" {% if entry.status == 'DONE' %}selected{% endif %}>Done</option>
            <option value="NR" {% if entry.status == 'NR' %}selected{% endif %}>NR (Not Running)</option>
            <option value="SD" {% if entry.status == 'SD' %}selected{% endif %}>SD (Shutdown)</option>
            <option value="NA" {% if entry.status == 'NA' %}selected{% endif %}>NA (Not Applicable)</option>
            <option value="NP" {% if entry.status == 'NP' %}selected{% endif %}>NP (Not Approachable)</option>
          </select>
        </form>
      </div>
  </td>
{% endif %}
