<div class="table-responsive">
  <table class="delays-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Duration</th>
        <th>Agency</th>
        <th>Equipment</th>
        <th>WHY-WHY/CAPA</th>
        {% if can_edit %}
          <th style="width: 90px; text-align: center;">Actions</th>
        {% endif %}
      </tr>
    </thead>
    <tbody>
      {% for r in records %}
        {% include "delays/partials/_record_row.html" with r=r %}
      {% empty %}
        <tr>
          <td colspan="{% if can_edit %}6{% else %}5{% endif %}" class="table-empty">
            No delay records found for this query. Upload an Excel sheet or log a manual entry!
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
